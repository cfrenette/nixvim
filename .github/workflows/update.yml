name: Update flake inputs

on:
  schedule:
    # Mondays, 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Update flake inputs
        id: update
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          token: ${{ secrets.ACTIONS_PAT }}
          branch: update-flake-lock
          commit-msg: "chore: update flake inputs"
          pr-title: "chore: update flake inputs"
          pr-labels: |
            dependencies
            automated

      - name: Enable auto-merge
        if: steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: gh pr merge --auto --squash "${{ steps.update.outputs.pull-request-number }}"
